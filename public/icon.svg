<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="pitchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#pitchGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#neonGreen)" stroke-width="6" opacity="0.6"/>

  <!-- Glowing outer circle -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#neonGreen)" stroke-width="8" stroke-dasharray="16 10" opacity="0.4"/>

  <!-- Central Soccer Ball -->
  <circle cx="256" cy="256" r="130" fill="#F8FAFC" stroke="#0F172A" stroke-width="8"/>
  
  <!-- Ball Pentagons -->
  <!-- Center pentagon -->
  <polygon points="256,206 298,236 282,286 230,286 214,236" fill="#0F172A" />
  
  <!-- Outer polygons and seams -->
  <!-- Top seam -->
  <line x1="256" y1="206" x2="256" y2="128" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <!-- Top Right seam -->
  <line x1="298" y1="236" x2="368" y2="198" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <!-- Bottom Right seam -->
  <line x1="282" y1="286" x2="338" y2="356" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <!-- Bottom Left seam -->
  <line x1="230" y1="286" x2="174" y2="356" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <!-- Top Left seam -->
  <line x1="214" y1="236" x2="144" y2="198" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>

  <!-- Outer patches -->
  <polygon points="256,128 226,126 214,150 256,160 298,150 286,126" fill="#0F172A" opacity="0.9"/>
  <polygon points="368,198 382,224 366,248 340,236" fill="#0F172A" opacity="0.9"/>
  <polygon points="144,198 130,224 146,248 172,236" fill="#0F172A" opacity="0.9"/>
  <polygon points="338,356 364,342 374,316 346,310" fill="#0F172A" opacity="0.9"/>
  <polygon points="174,356 148,342 138,316 166,310" fill="#0F172A" opacity="0.9"/>

  <!-- Glowing Badge: PLUS (+) symbol -->
  <circle cx="366" cy="146" r="54" fill="url(#goldGrad)" filter="url(#glow)"/>
  <circle cx="366" cy="146" r="50" fill="#10B981" stroke="#FFFFFF" stroke-width="4"/>
  <!-- Plus mark -->
  <line x1="366" y1="122" x2="366" y2="170" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <line x1="342" y1="146" x2="390" y2="146" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
</svg>
